aid: rexby
name: Rexby
description: Rexby is a consumer travel discovery and trip-planning platform where local creators
  publish interactive travel guides and maps of curated "spots," and travelers browse those guides,
  build personal itineraries, and follow creator recommendations. The product is delivered as iOS
  and Android mobile apps plus the rexby.com web experience, with a creator program that lets travel
  enthusiasts monetize their guides. Backed by Techstars. As of this profile Rexby publishes no
  public developer API, SDKs, or developer documentation; this apis.yml captures its identity and
  a domain-security probe for the API Evangelist network.
